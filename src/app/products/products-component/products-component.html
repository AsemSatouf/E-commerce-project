<main>
  <p class="welcomeMessage">{{ welcomeMessage }}</p>
 
  <div class="row g-4">
    <div
      class="col-12 col-sm-6 col-md-4 col-lg-3"
      *ngFor="let product of Products"
    >
      <div
        class="card product-card border-1 rounded-3 position-relative overflow-hidden"
      >
        <div class="img-wrapper position-relative overflow-hidden">
          <img
            [src]="'http://192.168.1.203:6060/itemimage/' + product.ImagePath"
            [alt]="product.ItemArName"
            class="card-img-top product-img"
          />

          <div class="btn-overlay d-flex justify-content-center gap-2">
            <button class="btn btn-outline-dark flex-fill fw-bold py-2">
              <i class="bi bi-eye me-2"></i> QUICK VIEW
            </button>
            <button class="btn btn-outline-dark flex-fill fw-bold py-2" (click)="addToCart(product)">
              Add To Cart
            </button>
          </div>
        </div>

        <div class="card-body p-3">
          <h6 class="text-muted mb-1">Cartzio</h6>
          <h5 class="card-title mb-2">{{ product.ItemArName }}</h5>

          <div class="price d-flex align-items-center">
            <span class="text-primary fw-bold fs-5">
              ${{ product.PriceLevel_Price }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
